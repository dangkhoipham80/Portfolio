# What runs before anything reaches main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api — ruff + pytest
    runs-on: ubuntu-latest

    # The suite inserts rows: it creates projects, users and contact messages
    # against whatever DATABASE_URL names, and conftest.py says as much. Until
    # now that was advice, and following it was on the person running the tests
    # — which is how the contacts table ended up holding 138 rows of "Rate Test"
    # in the database the site actually reads. A throwaway service container
    # makes it structural: there is nothing else here to point at.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: portfolio_test
          # No password at all, rather than a throwaway one. The container is
          # reachable only from this job and is destroyed with it, so a password
          # buys nothing — and a literal that looks like a credential in a
          # committed file is worth avoiding on its own account. This repo has
          # leaked a live database credential once already; secret scanners
          # flagging CI fixtures is noise that trains people to ignore them.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Without this the first step can connect before Postgres is accepting
        # connections, which fails as a confusing OperationalError in whichever
        # step happens to run first.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/portfolio_test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches runtime.txt and ruff's target-version, so a syntax feature
          # that works locally on 3.13 but not in production fails here.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Generate a signing key for this run
        # Minted here rather than written into the file. The app refuses to boot
        # on a key shorter than 32 characters, so something has to satisfy that
        # — and a 64-character hex literal sitting in a workflow is exactly what
        # a secret scanner should complain about, whether or not it is real.
        # This one exists for the life of the job and signs tokens for a
        # database that is thrown away with it.
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

      - name: Apply migrations
        # Alembic owns the schema; nothing creates tables implicitly. That makes
        # this the step that proves the migrations actually run on an empty
        # database, which a developer with an existing one never re-tests.
        run: alembic upgrade head

      - run: ruff check .

      - run: pytest

  web:
    name: web — lint + type-check + build + tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm type-check

      # No API is started for this job, and that is the test. Every read in
      # lib/api.ts returns a fallback, so the build has to succeed against a
      # backend that is not there — if it ever stops doing so, the site can be
      # taken down by a sleeping free-tier server, which is the exact thing the
      # fetch layer exists to prevent.
      #
      # This is also the command Vercel runs, so it stays here as its own step
      # even though the e2e suite below builds again. What it does not do is
      # look at the result: a build that succeeds has proved that nothing threw,
      # not that the pages say anything to a visitor.
      - run: pnpm build

      # Under a second, no browser. Pure functions only — the fallback logic in
      # lib/api.ts against every way a request can fail, and the contact form's
      # field rules, including whether they still match the API's schema.
      - run: pnpm test

      # Cache the browser binaries, not the OS packages.
      #
      # `playwright install` downloads ~130MB of Chromium, which is most of the
      # cost of running these tests in CI and is pure waste on a run where no
      # dependency moved. Keyed on the lockfile: too broad, since it re-downloads
      # when any unrelated package changes, but it can never serve a Chromium
      # that does not match the installed @playwright/test — and the failure
      # mode of a too-narrow key is a confusing version mismatch rather than a
      # slow run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Chromium alone — see the note in playwright.config.ts about why the
      # other two engines would triple this step for no extra signal.
      #
      # `--with-deps` still runs apt on a cache hit, which costs ~20s and cannot
      # be cached. That is the price of the whole browser layer, and it buys the
      # states nothing else here can reach: a 429 rendered as "about 45 minutes",
      # a dropped connection reported as "not sent", and the form working with
      # JavaScript switched off.
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      # Builds again, deliberately, against a port it has checked is closed.
      # Every page in this app is prerendered, so the fallback is chosen at build
      # time — a suite that reused a build made while an API was reachable would
      # be reading content, not fallbacks, and would pass no matter what.
      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Vercel redeploys apps/web on every push to main by itself. Fly does not, and
  # the gap is not theoretical: the contact-form email notification was merged,
  # reported as shipped, and sat undeployed on a machine still running the
  # previous image. Nothing failed — the deploy simply never happened, which is
  # the kind of gap that gets quieter each time rather than louder.
  deploy-api:
    name: api — deploy to Fly
    needs: api
    runs-on: ubuntu-latest
    # `needs: api` is the point: this job cannot start until ruff, the
    # migrations and all 93 tests have passed on this exact commit. Deploying
    # from a workflow of its own would have been simpler and would have removed
    # that guarantee.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # A second push while the first is mid-deploy would have two `fly deploy`
    # runs competing for the same machine. Queue rather than cancel: cancelling
    # a deploy half-way is how a release_command runs without the rollout that
    # was supposed to follow it.
    concurrency:
      group: deploy-api
      cancel-in-progress: false

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7
        with:
          # Need the previous commit to see what changed; the default shallow
          # clone has only this one.
          fetch-depth: 2

      # A web-only push should not roll the API machine. There is one machine,
      # so every restart is a few seconds during which the contact form's
      # Server Action gets a connection refused rather than a 201.
      - id: changed
        working-directory: .
        run: |
          before='${{ github.event.before }}'
          # All-zero SHA means the branch was just created and there is nothing
          # to diff against; deploy rather than silently skip.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -q '^apps/api/'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
            echo "No changes under apps/api — skipping deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.changed.outputs.api == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only builds on Fly's builder rather than needing Docker here.
      # fly.toml supplies the app name, the region and the release_command that
      # runs the migrations, so there is nothing to repeat on this line.
      - if: steps.changed.outputs.api == 'true'
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The deploy reports success when the machine passes its health check,
      # which only proves the process started. This asks the running API for
      # real content, which is what the site actually depends on.
      - if: steps.changed.outputs.api == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            https://khoi-portfolio-api.fly.dev/api/v1/projects/)
          echo "GET /api/v1/projects/ -> $code"
          test "$code" = "200"
